device:
  name: SteelSeries Arctis Nova 7X Gen 2
  vendor_id: 0x1038
  product_ids:
    - 0x229e # Arctis Nova 7x Gen 2
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_interface_index: [0, 3] # bInterfaceNumber, bAlternateSetting
  command_report_id: 0x00
  listen_interface_indexes: [3] # Listen to both in case async b9 03 arrives on 5

  device_init:
    - [0x10]  # ???
    - ['status.request']                            # Status Request
    - [0xa3, 'settings.pm_shutdown']                # Set inactive time (to 30 minutes, see INACTIVE_TIME_MINUTES)
    - [0xb2, 0x00]                                  # Bluetooth Standard Enabled on Power on
    - [0x3a, 'settings.volume_limiter']             # Volume Limiter (on/off)
    - [0xae, 'settings.mic_mute_led_brightness']    # Mute Light intensity (OFF=00 - Max=03)
    - [0x37, 'settings.mic_volume']                 # Mic Level (00 - 07)
    - [0xb3, 'settings.bluetooth_auto_mute']        # Bluetooth Call Mute (Off=00 - Mute=02)
    - [0x39, 'settings.mic_side_tone']              # SideTones (Off=00 - Max=03)
    - [0x09] # ???
    - ['status.request']                            # Status Request
    - [0x09] # ???
  status:
    request: 0xb0
    response_mapping:

      - starts_with: 0x45
        media_mix: 0x01
        chat_mix: 0x02

      - starts_with: 0xb0
        headset_power_status: 0x01
        headset_battery_charge: 0x02
        cable_charging: 0x03
        media_mix: 0x04
        chat_mix: 0x05
        bluetooth_connection: 0x06
        bluetooth_power_status: 0x07
        bluetooth_auto_mute: 0x08
        mic_status: 0x09
      
      - starts_with: 0xb9
        headset_power_status: 0x01

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
        - chat_mix
        - media_mix
        - cable_charging
      power_management:
        - pm_shutdown
      mic:
        - mic_status
        - mic_volume
        - mic_side_tone
        - mic_mute_led_brightness
      bluetooth:
        - bluetooth_power_status
        - bluetooth_auto_mute
        - bluetooth_connection
  
  online_status:
    status_variable: headset_power_status
    online_value: online

  settings:
    headset:
      volume_limiter:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00 # off
        update_sequence: [0x3a, 'value']
      bluetooth_power_status:
        type: toggle
        values:
          off: 0x00
          on: 0x01
          off_label: off
          on_label: on
        default: 0x00 # off
        update_sequence: [0xb2, 'value']
      bluetooth_auto_mute:
        type: slider
        min: 0x00
        max: 0x02
        step: 1
        values_mapping:
          0x00: none
          0x01: -12_db
          0x02: mute
        default: 0x00 # off
        update_sequence: [0xb3, 'value']
    microphone:
      mic_volume:
        type: slider
        min: 0x00
        max: 0x07
        step: 1
        min_label: mic_muted
        max_label: perc_100
        values_mapping:
          0x00: mic_0
          0x01: mic_1
          0x02: mic_2
          0x03: mic_3
          0x04: mic_4
          0x05: mic_5
          0x06: mic_6
          0x07: mic_7
        default: 0x07 # 100%
        update_sequence: [0x37, 'value']
      mic_side_tone:
        type: slider
        min: 0x00
        max: 0x03
        step: 1
        min_label: off
        max_label: high
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium  
          0x03: high
        default: 0x00 # off
        update_sequence: [0x39, 'value']
      mic_mute_led_brightness:
        type: slider
        min: 0x00
        max: 0x03
        step: 1
        values_mapping:
          0x00: off
          0x01: low
          0x02: medium  
          0x03: high
        default: 0x0a # 100%
        update_sequence: [0xae, 'value']
    power_management:
      pm_shutdown:
        type: slider
        min: 0x00
        max: 0x5a
        step: 1
        values_mapping:
          0x00: never
        value_suffix: Minutes
        default: 0x1e # 30 minutes
        update_sequence: [0xa3, 'value']

  status_parse:
    headset_power_status:
      type: int_str_mapping
      values:
        0x01: charging
        0x02: offline
        0x03: online
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 128
    cable_charging:
      type: int_str_mapping
      values:
        0x00: disconnected
        0x01: on
        0x03: off
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    bluetooth_connection:
      type: int_str_mapping
      values:
        0x00: off
        0x02: connected
        0x03: disconnected
        0x04: connected
        0x05: connected
    bluetooth_power_status:
      type: on_off
      off: 0x01
      on: 0x00
    bluetooth_auto_mute:
      type: int_str_mapping
      values:
        0x00: off
        0x01: -12db
        0x02: on      
    mic_status:
      type: int_str_mapping
      values:
        0x01: muted
        0x00: unmuted
