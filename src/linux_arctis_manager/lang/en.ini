[settings_descriptions]
redirect_audio_on_connect = Automatically routes all system audio to the headset when it powers on.
redirect_audio_on_disconnect_device = Automatically shifts system audio to this device when the headset powers off.
bluetooth_power_status = Determines whether Bluetooth should automatically turn on when the headset powers on.
volume_limiter = Caps the maximum audio output to protect your hearing (recommended: Off).
mic_volume = Adjusts the capture sensitivity of the microphone.
mic_side_tone = Controls how much of your own voice you can hear in the headset while speaking.
mic_mute_led_brightness = Sets the brightness of the red LED on the microphone when it is muted.
pm_shutdown = The headset will automatically power off after this many minutes of silence to save battery.
bluetooth_auto_mute = Controls what happens to the game/PC audio when you receive a call on the connected Bluetooth device.

